<title>WebHubShare — Discover Websites</title>
<style>
/* ============================================================
   Base
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --green:#1a73e8; --green-d:#1557b0; --blue:#1a73e8;
  --ink:#1f1f1f; --ink2:#3c4043; --muted:#5f6368; --line:#e8eaed;
  --chip:#f1f3f4; --bg:#fff; --gold:#f9ab00; --red:#e0245e;
  --sh1:0 1px 3px rgba(60,64,67,.16), 0 1px 2px rgba(60,64,67,.10);
  --sh2:0 4px 14px rgba(60,64,67,.16);
  --r:16px;
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:Roboto,"Google Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.45;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
img{display:block}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
::-webkit-scrollbar{height:0;width:0}

/* ============================================================
   Header
   ============================================================ */
header{
  position:sticky;top:0;z-index:60;background:#fff;isolation:isolate;
  border-bottom:1px solid transparent;transition:.2s;
}
header.scrolled{border-bottom-color:var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.head{display:flex;align-items:center;gap:12px;height:64px;overflow:hidden}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:19px;letter-spacing:-.3px;flex-shrink:0;cursor:pointer}
.brand .mark{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;overflow:hidden;
  background:#1a73e8;box-shadow:0 4px 12px rgba(26,115,232,.28);flex-shrink:0
}
.brand .mark img{width:100%;height:100%;object-fit:cover;display:block}
.brand em{font-style:normal;color:#1a73e8}
.searchwrap{flex:1;min-width:0;display:flex;align-items:center;gap:9px;background:var(--chip);border-radius:99px;padding:0 6px 0 14px;height:44px;transition:.18s;max-width:640px;margin:0 auto}
.searchwrap:focus-within{background:#fff;box-shadow:0 0 0 2px #d2e3fc, var(--sh2)}
.searchwrap svg{flex-shrink:0;color:var(--muted)}
.searchwrap input{flex:1;background:none;border:none;outline:none;font-size:15px;min-width:0}
.searchwrap input::placeholder{color:#80868b}
.avatar{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  background:linear-gradient(135deg,#1a73e8,#6c8cff);color:#fff;font-weight:700;font-size:15px;
  box-shadow:var(--sh1);cursor:pointer;transition:.18s
}
.avatar:hover{transform:scale(1.06)}
.avatar.guest{background:var(--chip);color:var(--muted);font-size:17px}

/* ============================================================
   Category chips
   ============================================================ */
.chips{display:flex;gap:8px;overflow-x:auto;padding:11px 0 7px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.chip{
  flex-shrink:0;padding:8px 16px;border-radius:99px;background:var(--chip);
  font-size:13.5px;font-weight:600;color:var(--ink2);transition:.16s;border:1px solid transparent
}
.chip:hover{background:#e4e7ea}
.chip.on{background:#e8f0fe;color:#1557b0;border-color:#c6dafc;font-weight:700}

/* ============================================================
   Section headers + horizontal rows
   ============================================================ */
.sec{margin-top:26px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-head h2{font-size:18px;font-weight:700;letter-spacing:-.25px}
.sec-head h2 span{font-weight:400;color:var(--muted);font-size:14px;margin-left:6px}
.seeall{font-size:13.5px;font-weight:700;color:var(--blue);flex-shrink:0}
.hrow{display:flex;gap:18px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity}
.hrow::-webkit-scrollbar{display:none}

/* ============================================================
   App tile (Play Store style)
   ============================================================ */
.tile{width:96px;flex-shrink:0;scroll-snap-align:start;cursor:pointer;text-align:left}
.tile .nm{
  font-size:13px;font-weight:500;color:var(--ink);margin-top:9px;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px
}
.badge{
  display:inline-flex;align-items:center;gap:4px;margin-top:7px;background:var(--chip);
  color:var(--ink2);font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;line-height:1.5
}
.badge .hrt{color:var(--red);font-size:10px}
.badge .str{color:var(--gold);font-size:10px}


/* ------------ icons (squircle) ------------ */
.ic{
  position:relative;display:grid;place-items:center;overflow:hidden;
  background:var(--chip);
  /* chaukor (square) with a soft rounded corner */
  border-radius:22%;
  border:1px solid rgba(60,64,67,.10);
  transition:transform .18s, background .18s
}
.ic img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;              /* icon poora chaukor bhar deta hai */
  object-position:center;
  border-radius:inherit;         /* halka rounded chaukor */
  display:block;
}
.ic.grad{color:#fff;font-weight:700;letter-spacing:-1px;border-color:transparent}
.ic.grad img{padding:0;object-fit:cover;background:transparent}
.tile:hover .ic{transform:translateY(-3px);background:#e8eaed}
.ic.sm{width:52px;height:52px;border-radius:15px;font-size:21px}
.ic.md{width:64px;height:64px;border-radius:18px;font-size:26px}
.ic.lg{width:88px;height:88px;border-radius:24px;font-size:36px}
.ic.xl{width:104px;height:104px;border-radius:28px;font-size:44px}

/* ============================================================
   Grid of all websites
   ============================================================ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:22px 14px;padding:4px 2px 22px}
.grid .tile{width:100%}
.grid .tile .ic{width:100%;height:auto;aspect-ratio:1;border-radius:26%}
.empty{text-align:center;padding:64px 16px;color:var(--muted)}
.empty .em{font-size:52px;margin-bottom:12px;opacity:.55}
.empty h3{color:var(--ink);font-size:17px;margin-bottom:5px;font-weight:700}
.empty p{font-size:14px}

/* ============================================================
   Detail page — App Store style banner
   ============================================================ */
.detail{padding-bottom:20px;animation:fade .26s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- colourful banner ---------- */
.bhero{
  position:relative;overflow:hidden;color:#fff;
  border-radius:0 0 26px 26px;padding:14px 18px 22px;
  margin:0 -16px;box-shadow:0 10px 30px -12px rgba(0,0,0,.35)
}
.bhero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(0,0,0,.18))
}
.bhero-deco{
  position:absolute;border-radius:50%;pointer-events:none;
  background:rgba(255,255,255,.13);filter:blur(.5px)
}
.bhero-deco.b1{width:190px;height:190px;top:-90px;right:-50px}
.bhero-deco.b2{width:120px;height:120px;bottom:-60px;left:-30px;background:rgba(255,255,255,.09)}
.bhero-top{
  position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px
}
.bicon{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:rgba(255,255,255,.18);backdrop-filter:blur(6px);transition:.16s;flex-shrink:0
}
.bicon:hover{background:rgba(255,255,255,.30)}
.bhero-cat{
  font-size:11.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
  background:rgba(255,255,255,.20);padding:5px 12px;border-radius:99px;backdrop-filter:blur(6px)
}
.bhero-main{
  position:relative;z-index:2;display:flex;align-items:center;gap:16px;margin-top:16px
}
.bicon-wrap{flex-shrink:0}
.bicon-lg,.bicon-letter{
  width:92px;height:92px;border-radius:22px;overflow:hidden;display:grid;place-items:center;
  background:#fff;box-shadow:0 10px 26px rgba(0,0,0,.28);
  border:2px solid rgba(255,255,255,.55)
}
.bicon-lg img{
  width:100%;height:100%;object-fit:cover;object-position:center;
  border-radius:inherit;display:block
}
.bicon-letter{
  background:rgba(255,255,255,.22);backdrop-filter:blur(8px);color:#fff;
  font-size:32px;font-weight:800;letter-spacing:-1px;border:1.5px solid rgba(255,255,255,.32)
}
.bicon-lg.fallback{background:rgba(255,255,255,.22);border:1.5px solid rgba(255,255,255,.32)}
.bicon-lg.fallback span{color:#fff;font-size:32px;font-weight:800;letter-spacing:-1px}
.bhero-text{min-width:0;flex:1}
.bhero-text h1{
  font-size:24px;font-weight:800;letter-spacing:-.6px;line-height:1.2;
  text-shadow:0 2px 10px rgba(0,0,0,.16);word-break:break-word
}
.bh-tag{font-size:13.5px;margin-top:6px;color:rgba(255,255,255,.94);line-height:1.42}
.bh-meta{font-size:12px;margin-top:8px;color:rgba(255,255,255,.82);display:flex;gap:6px;flex-wrap:wrap}
.bh-meta .dot{opacity:.6}

/* ---------- icon + share + like row ---------- */
.bhero-actions{position:relative;z-index:2;display:flex;gap:9px;margin-top:20px}
.bact{
  flex:1;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font-size:14px;font-weight:700;color:#fff;background:rgba(255,255,255,.20);
  backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.24);transition:.16s;white-space:nowrap
}
.bact:hover{background:rgba(255,255,255,.32)}
.bact.bact-main{flex:1.35;background:#fff;color:#1f1f1f;border-color:transparent;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.bact.bact-main:hover{background:#f5f5f7;transform:translateY(-1px)}
.bact.on{background:rgba(255,255,255,.92);color:var(--red);border-color:transparent}
.bact.on:hover{background:#fff}

/* ---------- rating summary ---------- */
.rsum{
  display:flex;align-items:center;gap:16px;padding:16px 4px 6px
}
.rsum-main{text-align:center;min-width:96px}
.rbig{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1;color:var(--ink)}
.rstars-mini{display:flex;gap:2px;justify-content:center;margin-top:5px;font-size:13px;color:#dadce0}
.rstars-mini .on{color:var(--gold)}
.rmeta{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:5px}
.rsum-div{width:1px;align-self:stretch;background:var(--line)}
.rsum-side{display:flex;gap:26px;flex:1;justify-content:center}
.rsm{text-align:center}
.rsm b{display:block;font-size:19px;font-weight:800;letter-spacing:-.5px}
.rsm small{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}

/* ---------- your rating card ---------- */
.ratecard{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:linear-gradient(135deg,color-mix(in srgb,var(--pal1) 9%,#fff),color-mix(in srgb,var(--pal2) 9%,#fff));
  border:1px solid color-mix(in srgb,var(--pal1) 20%,#e8eaed);
  border-radius:16px;padding:15px 16px;margin-top:12px
}
.ratecard-l{flex:1;min-width:130px}
.rc-t{font-size:14.5px;font-weight:800;letter-spacing:-.2px}
.rc-s{font-size:12px;color:var(--muted);margin-top:2px}
.rate-stars{display:flex;gap:3px}
.rstar{font-size:28px;line-height:1;color:#d8dbe0;transition:.14s;padding:0 1px}
.rstar:hover{transform:scale(1.16)}
.rstar.on{color:var(--gold);text-shadow:0 2px 10px rgba(249,171,0,.35)}

/* ---------- about / details ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}
.card h3{font-size:15.5px;font-weight:800;margin-bottom:11px;letter-spacing:-.2px}
.about{font-size:14.5px;color:var(--ink2);line-height:1.68;white-space:pre-wrap}

.dl{display:flex;flex-direction:column}
.dl-r{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:10px 0;border-bottom:1px solid var(--line);font-size:14px
}
.dl-r:last-child{border-bottom:none;padding-bottom:0}
.dl-r span{color:var(--muted);font-weight:600;flex-shrink:0}
.dl-r b{font-weight:700;text-align:right;word-break:break-word}
.dl-r b a{color:var(--blue)}

@media(min-width:800px){
  .bhero{margin:0;border-radius:26px;padding:20px 26px 26px}
  .bhero-text h1{font-size:30px}
  .bicon-lg,.bicon-letter{width:112px;height:112px;border-radius:28px;font-size:38px}
  .bicon-lg.fallback span{font-size:38px}
  .bhero-actions{max-width:520px}
  .rsum{padding:22px 6px 8px;justify-content:flex-start;gap:34px;max-width:560px}
  .rsum-side{gap:48px;justify-content:flex-start}
  .rbig{font-size:38px}
  .ratecard{margin-top:16px}
}

/* ============================================================
   Lists (my submissions / admin)
   ============================================================ */
.page{padding-top:8px}
.phead{padding:16px 0 4px}
.phead h1{font-size:23px;font-weight:700;letter-spacing:-.5px}
.phead p{color:var(--muted);font-size:14px;margin-top:3px}
.rowi{
  display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line);
  cursor:pointer;transition:.15s
}
.rowi:hover{background:#fafbfc}
.rowi .in{flex:1;min-width:0}
.rowi .in h4{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rowi .in p{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.acts{display:flex;gap:7px;flex-shrink:0;align-self:flex-start;align-items:center}
.mini{
  padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:700;transition:.15s;white-space:nowrap
}
.mini.ok{background:#e6f4ea;color:#0d652d}
.mini.ok:hover{background:#d7f0e3}
.mini.no{background:#fce8e6;color:#c5221f}
.mini.no:hover{background:#fadbd8}
.mini.gh{background:var(--chip);color:var(--ink2)}
.mini.gh:hover{background:#e4e7ea}
.tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.4px}
.tag.pending{background:#fef7e0;color:#b06000}
.tag.approved{background:#e6f4ea;color:#0d652d}
.tag.rejected{background:#fce8e6;color:#c5221f}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin:16px 0 6px}
.stat{background:var(--chip);border-radius:14px;padding:14px 12px}
.stat .n{font-size:23px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.stat .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:3px}

/* ============================================================
   Forms
   ============================================================ */
.form{max-width:560px;margin:0 auto;padding-bottom:24px}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:var(--ink2)}
.fld input,.fld textarea,.fld select{
  width:100%;background:#fff;border:1px solid #dadce0;border-radius:11px;padding:12px 14px;
  font-size:14.5px;outline:none;transition:.16s
}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,115,232,.14)}
.fld textarea{resize:vertical;min-height:96px;line-height:1.55}
.fld .hint{font-size:12px;color:var(--muted);margin-top:6px}
.logorow{display:flex;gap:14px;align-items:center}
.logoprev{
  width:72px;height:72px;border-radius:18px;background:var(--chip);border:1.5px dashed #c8ccd0;
  display:grid;place-items:center;overflow:hidden;flex-shrink:0;color:#9aa0a6
}
.logoprev img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.tabs2{display:flex;gap:6px;background:var(--chip);padding:4px;border-radius:11px;margin-bottom:11px}
.tabs2 button{flex:1;padding:8px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted);transition:.15s}
.tabs2 button.on{background:#fff;color:#1557b0;box-shadow:var(--sh1)}
.btn{
  width:100%;height:48px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;
  font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;transition:.16s;
  box-shadow:0 2px 8px rgba(26,115,232,.26)
}
.btn:hover{background:#1557b0}
.btn.sec{background:#fff;color:var(--blue);border:1px solid #d2e3fc;box-shadow:none}
.btn.sec:hover{background:#f6f9ff}
.err{background:#fce8e6;border:1px solid #f5c6c2;color:#c5221f;padding:11px 14px;border-radius:10px;font-size:13.5px;margin-bottom:15px;display:none;font-weight:500}
.err.show{display:block}
.banner{display:flex;gap:11px;background:#f4fbf7;border:1px solid #cde8db;border-radius:12px;padding:13px 15px;font-size:13px;color:#0d652d;margin-bottom:18px;line-height:1.55}

/* ---------- step form ---------- */
.fstep{display:flex;align-items:flex-start;gap:11px;margin:22px 0 9px}
.fstep .fnum{
  width:24px;height:24px;border-radius:50%;background:#e8f0fe;color:#1a73e8;
  font-size:12.5px;font-weight:800;display:grid;place-items:center;flex-shrink:0;margin-top:1px
}
.fstep .ft{font-size:14.5px;font-weight:800;letter-spacing:-.2px;line-height:1.35}
.fstep .fs{font-size:12.5px;color:var(--muted);margin-top:1px;line-height:1.4}
.formfoot{text-align:center;font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.55}
.form .fld{margin-bottom:4px}

/* dropzone */
.dropzone{
  display:flex;align-items:center;gap:13px;padding:13px;cursor:pointer;
  border:1.6px dashed #c8ccd0;border-radius:14px;background:#fafbfd;transition:.16s
}
.dropzone:hover,.dropzone:focus-within{border-color:#1a73e8;background:#f4f8ff}
.dropzone.ok{border-style:solid;border-color:#9fd4b5;background:#f6fdf9}
.dropzone .dz-t{flex:1;min-width:0;display:flex;flex-direction:column}
.dropzone .dz-t b{font-size:13.5px;color:var(--ink)}
.dropzone .dz-t span{font-size:11.5px;color:var(--muted);margin-top:2px}
.dropzone .dz-t span b{color:#c5221f;font-weight:700}
.dropzone > svg:last-child{color:var(--blue);flex-shrink:0}

/* size meter */
.sizebar{margin-top:10px;background:var(--chip);border-radius:11px;padding:10px 12px}
.sizebar-row{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin-bottom:7px}
.sizebar-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sizebar-row b{flex-shrink:0;font-weight:800}
.track{height:6px;border-radius:99px;background:#dfe3e7;overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:var(--green);transition:width .3s,background .3s}
.sizehint{font-size:11.5px;margin-top:6px;font-weight:600}

/* ============================================================
   Bottom nav
   ============================================================ */
.bnav{
  position:fixed;bottom:0;left:0;right:0;z-index:70;background:rgba(255,255,255,.97);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom)
}
.bnav a{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;
  font-size:11px;font-weight:600;color:var(--muted);transition:.15s;position:relative
}
.bnav a .bi{font-size:19px;line-height:1}
.bnav a.on{color:var(--blue)}
.bnav a.on .bi{transform:translateY(-1px)}
.pad-bottom{height:76px}
.wrap-desk{display:none}
#navwrap{display:none}

/* ============================================================
   Sheet / modal
   ============================================================ */
.overlay{
  position:fixed;inset:0;background:rgba(32,33,36,.55);z-index:120;
  display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)
}
.overlay.show{display:flex}
.sheet{
  background:#fff;width:100%;max-width:440px;border-radius:22px 22px 0 0;padding:22px;
  animation:up .26s cubic-bezier(.2,.9,.3,1);max-height:92vh;overflow-y:auto
}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet h2{font-size:20px;font-weight:700;letter-spacing:-.4px}
.sheet .sub{color:var(--muted);font-size:13.5px;margin:4px 0 18px}
.sheet .grab{width:38px;height:4px;border-radius:99px;background:#dadce0;margin:-8px auto 14px}
.switch{text-align:center;font-size:13.5px;color:var(--muted);margin-top:15px}
.switch a{color:var(--blue);font-weight:700;cursor:pointer}
.menuitem{display:flex;align-items:center;gap:13px;padding:14px 4px;font-size:15px;font-weight:600;border-bottom:1px solid var(--line);cursor:pointer}
.menuitem:last-child{border:none}
.menuitem span:first-child{font-size:19px;width:26px;text-align:center}
.menuitem.danger{color:#c5221f}

/* ---------- share / copy sheet ---------- */
.copybox{
  background:var(--chip);border:1px dashed #c8ccd0;border-radius:12px;
  padding:13px 14px;font-size:12.5px;color:var(--ink2);word-break:break-all;
  line-height:1.5;margin-bottom:16px;position:relative;transition:.2s
}
.copybox.done{border-style:solid;border-color:#c6dafc;background:#f6f9ff;color:#1557b0}

/* toast */
#toast{
  position:fixed;bottom:88px;left:50%;transform:translate(-50%,20px);z-index:200;
  background:#202124;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:500;
  box-shadow:0 8px 26px rgba(0,0,0,.35);opacity:0;transition:.28s;pointer-events:none;
  max-width:calc(100vw - 40px);text-align:center
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ============================================================
   Desktop polish
   ============================================================ */
@media(max-width:480px){
  .head{gap:9px}
  .brand span:last-child{font-size:16px}
  .searchwrap input{font-size:14px}
  .searchwrap input::placeholder{font-size:13.5px}
}
@media(min-width:800px){
  .wrap-desk{display:block;flex-shrink:0}
  #navwrap{display:block}
  .bnav{position:static;border:none;background:none;justify-content:flex-end;gap:4px;padding:0}
  .bnav a{flex:0 0 auto;flex-direction:row;gap:7px;padding:9px 15px;border-radius:99px;font-size:13.5px}
  .bnav a.on{background:#e8f0fe}
  .bnav a .bi{font-size:16px}
  .pad-bottom{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:26px 18px}
  .tile{width:112px}
  .detail{padding-top:6px}
  .dhero{padding:30px 20px}
  .overlay{align-items:center}
  .sheet{border-radius:20px;animation:pop2 .2s ease}
  @keyframes pop2{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
}
</style>
</head>

<script>
/* ==========================================================================
   WebHubShare — Play Store style directory (single file, no dependencies)
   ========================================================================== */

const KEY = 'whs_db_v3';
const CATS = ['All','Social','Entertainment','Shopping','Education','Tools','News','Games','Finance','AI','Other'];
/* Rich banner palettes — each website automatically gets a different one */
const HUES = [
  ['#5b6cff','#8b5cf6'], ['#ff5f6d','#ffc371'], ['#11998e','#38ef7d'],
  ['#f7971e','#ffd200'], ['#c471ed','#f64f59'], ['#00b4db','#0083b0'],

];
const GRADS = [

  ['#ff5252','#ff1744'],['#448aff','#2962ff'],['#00bfa5','#00a884'],
  ['#ffb300','#ff8f00'],['#ab47bc','#7b1fa2'],['#ec407a','#d81b60'],

];

/* ---------------- state ---------------- */
let db = null;
let ui = { route:'/', cat:'All', q:'', user:null, authMode:'login', logoSrc:'', logoTab:'upload' };

/* ---------------- seed ---------------- */
const SEED = [
  ['YouTube','https://youtube.com','Entertainment','Watch, share and discover videos on every topic — music, tutorials, vlogs, gaming, comedy and much more. Home to millions of creators worldwide.'],
  ['WhatsApp','https://web.whatsapp.com','Social','Send messages, photos and make free voice and video calls to anyone in the world. Simple, reliable and private messaging.'],
  ['Wikipedia','https://wikipedia.org','Education','The free encyclopedia that anyone can edit. Millions of articles on every subject imaginable, in 300+ languages.'],
  ['GitHub','https://github.com','Tools','The world\'s leading platform to build, host and collaborate on software. Millions of open source projects live here.'],
  ['ChatGPT','https://chat.openai.com','AI','An AI assistant that writes, codes, explains, translates and brainstorms with you. Ask anything, get useful answers.'],
  ['Spotify','https://open.spotify.com','Entertainment','Stream millions of songs, podcasts and playlists from artists all over the world. Discover your next favourite track.'],
  ['Amazon','https://amazon.in','Shopping','Shop online for electronics, fashion, books, groceries and almost everything else — with fast delivery at home.'],
  ['Stack Overflow','https://stackoverflow.com','Education','The largest community of developers asking and answering programming questions. Get unstuck in minutes.'],
  ['Reddit','https://reddit.com','Social','Dive into thousands of communities on any topic — news, memes, discussions, hobbies and honest advice.'],
  ['Netflix','https://netflix.com','Entertainment','Watch unlimited movies, TV shows, documentaries and award-winning original series on any device.'],
  ['Canva','https://canva.com','Tools','Design posters, presentations, logos and social media posts in minutes — no design skills needed, free to start.'],
  ['BBC News','https://bbc.com','News','Breaking news, analysis and in-depth reporting from around the world, updated 24 hours a day.'],
  ['Khan Academy','https://khanacademy.org','Education','Free world-class education for anyone, anywhere. Maths, science, economics and more with practice exercises.'],
  ['Chess.com','https://chess.com','Games','Play chess online with friends or millions of players worldwide, solve puzzles and improve your rating.'],
  ['NSE India','https://nseindia.com','Finance','India\'s leading stock exchange — live market data, company listings, indices and investor resources.'],
  ['Google Drive','https://drive.google.com','Tools','Store, share and collaborate on files securely in the cloud. Access your documents from any device.'],
  ['Discord','https://discord.com','Social','Talk, hang out and stay close with communities and friends through voice, video and text channels.'],
  ['Figma','https://figma.com','Tools','Collaborative interface design tool that runs in your browser. Design, prototype and hand off — all in real time.']
];

function freshDB(){
  const now = Date.now();
  const d = { users:[], sites:[], nextId:1, myRatings:{}, vid:'v'+Math.random().toString(36).slice(2,10) };
  d.users.push({ id:1, name:'Admin', email:'admin@webhubshare.com', pass:h('admin123'), admin:true });
  SEED.forEach((s,i)=>{
    const likes = Math.floor(Math.random()*2400)+90;
    d.sites.push({
      id: d.nextId++,
      name:s[0], url:s[1], cat:s[2], desc:s[3],
      logo:'https://www.google.com/s2/favicons?domain='+new URL(s[1]).hostname+'&sz=128',
      grad: i % GRADS.length,
      status:'approved',
      by:'Admin', byName:'WebHubShare Team',
      likes, likedBy:[],
      ratings: Array.from({length: 4+Math.floor(Math.random()*40)}, ()=> 3+Math.floor(Math.random()*3)),
      visits: Math.floor(Math.random()*4200)+180,
      at: now - i*5400000
    });
  });
  return d;
}
function h(s){ let x=5381; for(let i=0;i<s.length;i++) x=((x<<5)+x+s.charCodeAt(i))|0; return 'h'+(x>>>0).toString(36); }

function loadDB(){
  try{
    const raw = localStorage.getItem(KEY);
    db = raw ? JSON.parse(raw) : null;
  }catch(e){ db = null; }
  if(!db || !db.sites || !db.users) db = freshDB();
  if(!db.myRatings) db.myRatings = {};
  if(!db.vid) db.vid = 'v'+Math.random().toString(36).slice(2,10);
  saveDB();
  const sess = localStorage.getItem(KEY+'_s');
  const u = sess && db.users.find(x=>String(x.id)===sess);
  if(u) ui.user = u;
}
function saveDB(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }

/* older saved records may hold messy URLs — clean them once so Visit always works */
function healUrls(){
  let changed = false;
  db.sites.forEach(w=>{
    const fixed = safeUrl(w.url);
    if(fixed && fixed !== w.url){ w.url = fixed; changed = true; }
  });
  if(changed) saveDB();
}

function hueOf(w){
  /* stable per-website colour — same website always gets the same banner */
  if(typeof w.hue === 'number') return w.hue % HUES.length;
  const str = String(w.name || '') + '#' + String(w.id || '');
  let n = 2166136261;
  for(let i=0;i<str.length;i++){
    n ^= str.charCodeAt(i);
    n = Math.imul(n, 16777619) >>> 0;
  }
  return n % HUES.length;
}
function bannerGrad(w){
  const h = HUES[hueOf(w)];
  return `linear-gradient(135deg,${h[0]},${h[1]})`;
}
function initials(name){
  const parts = String(name||'?').trim().split(/\s+/).filter(Boolean);
  if(parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return String(name||'?').trim().slice(0,2).toUpperCase();
}
const grad = i => { const g = GRADS[(i||0)%GRADS.length]; return `linear-gradient(135deg,${g[0]},${g[1]})`; };
const avg = w => w.ratings && w.ratings.length ? w.ratings.reduce((a,b)=>a+b,0)/w.ratings.length : 0;
function fmt(n){
  n = Number(n)||0;
  if(n >= 1e6) return (n/1e6).toFixed(1).replace('.0','')+'M';
  if(n >= 1000) return (n/1000).toFixed(1).replace('.0','')+'k';
  return String(n);
}
function timeAgo(t){
  const s = Math.floor((Date.now()-t)/1000);
  if(s<60) return 'just now';
  const m = Math.floor(s/60); if(m<60) return m+' min ago';
  const hr = Math.floor(m/60); if(hr<24) return hr+' hr ago';
  const dd = Math.floor(hr/24); if(dd<30) return dd+' day'+(dd>1?'s':'')+' ago';
  const mo = Math.floor(dd/30); if(mo<12) return mo+' month'+(mo>1?'s':'')+' ago';
  return Math.floor(mo/12)+' yr ago';
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ---------------- icon renderer ---------------- */
function icon(w, size){
  const letter = esc((w.name||'?').trim().charAt(0).toUpperCase());
  const g = grad(w.grad);
  const cls = 'ic ' + (size||'md');
  if(!w.logo){
    return `<div class="${cls} grad" style="background:${g}"><span>${letter}</span></div>`;
  }
  return `<div class="${cls}"><img src="${esc(w.logo)}" alt="" loading="lazy"
    data-g="${esc(g)}" data-l="${letter}" data-n="${esc(w.name)}" onerror="iconFail(this)"></div>`;
}
function iconFail(img){
  const p = img.parentNode, g = img.dataset.g, l = img.dataset.l;
  p.classList.add('grad'); p.style.background = g; p.innerHTML = '<span>'+l+'</span>';
}

/* ---------------- card / tile ---------------- */
function tile(w){
  return `<div class="tile" onclick="go('/app/${w.id}')">
    ${icon(w,'lg')}
    <div class="nm">${esc(w.name)}</div>
    <div class="badge">${ico("heartfill",11)}${fmt(w.likes)}</div>
  </div>`;
}
function hrow(title, sub, list, seeAllCat){
  if(!list.length) return '';
  return `<section class="sec">
    <div class="sec-head">
      <h2>${title}${sub?` <span>${sub}</span>`:''}</h2>
      ${seeAllCat?`<a class="seeall" onclick="setCat('${seeAllCat}')">See all</a>`:''}
    </div>
    <div class="hrow">${list.map(tile).join('')}</div>
  </section>`;
}

function viewHome(){
  const approved = db.sites.filter(s=>s.status==='approved');
  const q = ui.q.toLowerCase().trim();
  let list = approved;
  if(ui.cat !== 'All') list = list.filter(s=>s.cat===ui.cat);
  if(q) list = list.filter(s=>(s.name+' '+s.desc+' '+s.cat).toLowerCase().includes(q));

  if(q){
    return `<div class="page">
      <div class="phead"><h1>${list.length ? 'Results for “'+esc(ui.q)+'”' : 'No results'}</h1>
      <p>${list.length} website${list.length!==1?'s':''} found</p></div>
      ${list.length
        ? `<div class="grid">${list.map(tile).join('')}</div>`
        : `<div class="empty"><div class="em">${ico('search',46)}</div><h3>Nothing found</h3><p>Try a different name or category.</p></div>`}
    </div>`;
  }

  if(ui.cat !== 'All'){
    return `<div class="page">
      <div class="phead"><h1>${esc(ui.cat)}</h1><p>${list.length} website${list.length!==1?'s':''} in this category</p></div>
      <div class="grid">${list.map(tile).join('')}</div>
    </div>`;
  }

  const byLikes = [...approved].sort((a,b)=>(b.likes||0)-(a.likes||0));
  const newest = [...approved].sort((a,b)=>b.at-a.at);
  const byRating = [...approved].sort((a,b)=>avg(b)-avg(a));
  const all = [...approved].sort((a,b)=>(b.likes||0)-(a.likes||0));

  return `<div class="page">
    ${hrow(ico('fire',19)+' Trending now','most liked',byLikes.slice(0,12))}
    ${hrow(ico('plus',19)+' Just added','fresh finds',newest.slice(0,12))}
    ${hrow(ico('starfill',19)+' Top rated','community favourites',byRating.slice(0,12))}
    <section class="sec">
      <div class="sec-head"><h2>All websites <span>${approved.length}</span></h2></div>
      <div class="grid">${all.map(tile).join('')}</div>
    </section>
  </div>`;
}

  const a      = avg(w);
  const hue    = hueOf(w);
  const pal    = HUES[hue];

  const stars = [1,2,3,4,5].map(n=>{
    const filled = myRate ? n<=myRate : n<=Math.round(a);
    return `<button class="rstar${filled?' on':''}" onclick="rate(${w.id},${n})" title="${n} star">★</button>`;
  }).join('');

  const similar = db.sites
    .filter(s=>s.status==='approved' && s.id!==w.id && s.cat===w.cat)

    .filter(s=>s.status==='approved' && s.id!==w.id && s.cat!==w.cat)

        <div class="bhero-cat">${esc(w.cat)}</div>
      </div>

      <div class="bhero-main">
        <div class="bicon-wrap">
          ${w.logo
            ? `<div class="bicon-lg"><img src="${esc(w.logo)}" alt="${esc(w.name)}" onerror="bannerIconFail(this)"></div>`
            : `<div class="bicon-letter">${esc(initials(w.name))}</div>`}
        </div>
        <div class="bhero-text">
          <h1>${esc(w.name)}</h1>
          <div class="bh-meta">
            <span>${esc(w.byName || 'Community')}</span>
            <span class="dot">·</span>
            <span>${timeAgo(w.at)}</span>
          </div>
        </div>
      </div>

      <div class="bhero-actions">
        <a class="bact bact-main" href="${esc(safeUrl(w.url) || '#')}" target="_blank" rel="noopener noreferrer"
           onclick="return openSite(${w.id}, event)">
          ${ico('external',17)} Visit
        </a>
        <button class="bact${liked?' on':''}" onclick="like(${w.id})" aria-label="Like">
          ${liked?ico('heartfill',17):ico('heart',17)} ${liked?'Liked':'Like'}
        </button>
        <button class="bact" onclick="shareSite(${w.id})" aria-label="Share">
          ${ico('share',17)} Share
        </button>
      </div>
    </div>

    <!-- ============ RATING + LIKES SUMMARY ============ -->
    <div class="rsum">
      <div class="rsum-main">
        <div class="rbig">${a ? a.toFixed(1) : '—'}</div>
        <div class="rstars-mini">${[1,2,3,4,5].map(n=>`<span class="${a && n<=Math.round(a)?'on':''}">★</span>`).join('')}</div>
        <div class="rmeta">${fmt(w.ratings.length)} ratings</div>
      </div>
      <div class="rsum-div"></div>
      <div class="rsum-side">
        <div class="rsm"><b>${fmt(w.likes)}</b><small>likes</small></div>
        <div class="rsm"><b>${fmt(w.visits)}</b><small>visits</small></div>
      </div>
    </div>

    <!-- ============ YOUR RATING ============ -->
    <div class="ratecard">
      <div class="ratecard-l">
        <div class="rc-t">${myRate ? 'Your rating' : 'Rate this website'}</div>
        <div class="rc-s">${myRate ? 'Tap a star to change it' : 'Tap a star — takes one second'}</div>
      </div>
      <div class="rate-stars">${stars}</div>
    </div>

    <!-- ============ ABOUT ============ -->
    <div class="card">
      <h3>About this website</h3>
      <div class="about">${esc(w.desc)}</div>
    </div>

    <!-- ============ DETAILS ============ -->
    <div class="card">
      <h3>Details</h3>

        <div class="dl-r"><span>Category</span><b>${esc(w.cat)}</b></div>

function bannerIconFail(img){
  const wrap = img.parentNode;
  const name = wrap.getAttribute('data-n') || '';
  wrap.classList.add('fallback');
  wrap.innerHTML = '<span>'+initials(name)+'</span>';
}

function route(){

/* clean any user-entered URL into a working absolute link */
function safeUrl(u){
  let v = String(u || '').trim();
  if(!v) return '';
  v = v.replace(/\s+/g, '');
  v = v.replace(/^(https?):\/*/i, '$1://');   // https:/x -> https://x
  if(!/^https?:\/\//i.test(v)){
    v = v.replace(/^\/+/, '');
    v = 'https://' + v;
  }
  try {
    const parsed = new URL(v);
    if(!parsed.hostname || parsed.hostname.indexOf('.') === -1) return '';
    return parsed.href;
  } catch(e){ return ''; }
}

/* Visit — hamesha user ki website par redirect karta hai */
function openSite(id, ev){
  if(ev){ ev.preventDefault(); ev.stopPropagation(); }

  const w = db.sites.find(s=>s.id===id);
  const target = safeUrl(w ? w.url : '');

  if(!target){
    toast('Is website ka link theek nahi hai');
    return false;
  }

  /* visit count badhao */
  if(w){ w.visits = (w.visits||0)+1; saveDB(); }

  /* kya hum kisi frame/preview ke andar chal rahe hain? */
  let inFrame = false;
  try{ inFrame = window.self !== window.top; }catch(e){ inFrame = true; }

  /* 1) new tab me kholne ki koshish (user gesture ke andar) */
  let win = null;
  try{ win = window.open(target, '_blank'); }catch(e){ win = null; }
  if(win){ try{ win.opener = null; }catch(e){} return false; }

  /* 2) normal tab (koi frame nahi) — usi tab me redirect */
  if(!inFrame){ window.location.href = target; return false; }

  /* 3) frame ke andar hain — poori top window ko redirect karo
     (frame ke andar nahi kholna: badi sites frame me khulne se mana karti hain) */
  try{ window.top.location.href = target; return false; }catch(e){}

  /* 4) browser ne sab rok diya — user ko seedha link do */
  visitSheet(w, target);
  return false;
}

function copyLink(link){
  const ok = () => {
    const btn = document.getElementById('copyBtn');
    if(btn){
      btn.innerHTML = 'Copied ✓';
      btn.style.background = 'var(--green-d)';
    }
    const box = document.getElementById('copybox');
    if(box) box.classList.add('done');
    toast('Link copy ho gaya');
  };

  const fallback = () => {
    try{
      const t = document.createElement('textarea');
      t.value = link;
      t.style.position = 'fixed';
      t.style.opacity = '0';
      document.body.appendChild(t);
      t.select();
      document.execCommand('copy');
      document.body.removeChild(t);
      ok();
    }catch(e){
      toast('Copy nahi hua — link: ' + link);
    }
  };

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(link).then(ok).catch(fallback);
  } else {
    fallback();
  }
}

const MAX_ICON_KB = 50;              // hard limit the user asked for
const MAX_ICON_BYTES = MAX_ICON_KB * 1024;

function dataURLBytes(dataURL){
  const i = dataURL.indexOf(',');
  const b64 = dataURL.slice(i + 1);
  const pad = (b64.match(/=+$/) || [''])[0].length;
  return Math.floor(b64.length * 3 / 4) - pad;
}
function kb(bytes){ return (bytes/1024).toFixed(1) + ' KB'; }

function setSizeMeter(name, bytes, ok){
  const bar = document.getElementById('sizebar');
  if(!bar) return;
  bar.style.display = 'block';
  document.getElementById('fname').textContent = name;
  const fsz = document.getElementById('fsize');
  fsz.textContent = kb(bytes) + (ok ? '' : ' · bahut bada');
  fsz.style.color = ok ? '#1557b0' : '#c5221f';
  const pct = Math.min(100, (bytes / MAX_ICON_BYTES) * 100);
  const fill = document.getElementById('ffill');
  fill.style.width = pct + '%';
  fill.style.background = ok ? 'var(--green)' : '#c5221f';
  document.getElementById('fhint').textContent = ok
    ? 'Perfect — limit ke andar hai (max ' + MAX_ICON_KB + ' KB)'
    : 'Icon ' + MAX_ICON_KB + ' KB se chhota hona chahiye';
  document.getElementById('fhint').style.color = ok ? '#1557b0' : '#c5221f';
  const sb = document.getElementById('shrinkBtn');
  if(sb) sb.style.display = ok ? 'none' : 'flex';
}

/* compress any image to fit under 50 KB, square-cropped */
function compressToLimit(img, maxKB){
  const limit = maxKB * 1024;
  let size = 256;
  let out = '';
  for(let pass = 0; pass < 6; pass++){
    /* every icon is stored as a perfect 1:1 square (centre crop) */
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    const side = Math.min(img.width, img.height);
    const sx = Math.round((img.width  - side) / 2);
    const sy = Math.round((img.height - side) / 2);
    ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
    let q = 0.92;
    for(let i = 0; i < 12; i++){
      out = c.toDataURL('image/jpeg', q);
      if(dataURLBytes(out) <= limit) return { data: out, bytes: dataURLBytes(out) };
      q -= 0.08;
      if(q < 0.3) break;
    }
    size = Math.round(size * 0.78);
    if(size < 48) break;
  }
  return { data: out, bytes: dataURLBytes(out) };
}

function pickLogo(ev){
  const f = ev.target.files[0];
  if(!f) return;
  ui._pendingIcon = null;

  if(f.size > MAX_ICON_BYTES){
    toast('Icon ' + kb(f.size) + ' hai — ' + MAX_ICON_KB + ' KB se kam chahiye');
  }

  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      ui._iconSource = img;
      const res = compressToLimit(img, MAX_ICON_KB);
      ui._pendingIcon = res;
      const ok = res.bytes <= MAX_ICON_BYTES;
      ui.logoSrc = ok ? res.data : '';
      document.getElementById('logoPrev').innerHTML = '<img src="'+res.data+'">';
      document.getElementById('dropzone').classList.toggle('ok', ok);
      setSizeMeter(f.name, res.bytes, ok);
      if(ok) toast('Icon ready · ' + kb(res.bytes));
      else  toast('Auto-compress dabao — ' + kb(res.bytes) + ' abhi bhi bada hai');
    };
    img.onerror = () => toast('Ye image padhi nahi ja saki — doosri chuno');
    img.src = e.target.result;
  };
  reader.readAsDataURL(f);
}

function shrinkLogo(){
  if(!ui._iconSource){ toast('Pehle icon chuno'); return; }
  const res = compressToLimit(ui._iconSource, MAX_ICON_KB - 1);
  ui._pendingIcon = res;
  const ok = res.bytes <= MAX_ICON_BYTES;
  ui.logoSrc = ok ? res.data : '';
  document.getElementById('logoPrev').innerHTML = '<img src="'+res.data+'">';
  document.getElementById('dropzone').classList.toggle('ok', ok);
  setSizeMeter('compressed', res.bytes, ok);
  toast(ok ? 'Ho gaya — ' + kb(res.bytes) : 'Nahi bana, chhoti image try karo');
}

  if(bar) bar.style.display = 'none';
  const sb = document.getElementById('shrinkBtn');
  if(sb) sb.style.display = 'none';
}

function subErr(m){
  const e = document.getElementById('subErr');
  e.textContent = m; e.classList.add('show');
  e.scrollIntoView({behavior:'smooth', block:'center'});
}
function doSubmit(){
  const name = document.getElementById('sName').value.trim();
  const url  = document.getElementById('sUrl').value.trim();
  const desc = document.getElementById('sDesc').value.trim();
  const cat  = document.getElementById('sCat').value;

  if(!name) return subErr('Website ka naam likho.');
  const cleanUrl = safeUrl(url);
  if(!cleanUrl) return subErr('Sahi link daalo — jaise https://example.com');
  if(desc.length < 15) return subErr('Description likho (kam se kam 15 akshar).');
  if(!ui.logoSrc) return subErr('Icon zaroori hai — upload karo ya image URL do.');

  /* 50 KB hard limit for uploaded icons */
  if(ui.logoTab === 'upload' && ui.logoSrc.startsWith('data:')){
    const bytes = dataURLBytes(ui.logoSrc);
    if(bytes > MAX_ICON_BYTES)
      return subErr('Icon ' + kb(bytes) + ' hai — ' + MAX_ICON_KB + ' KB se kam chahiye. Auto-compress dabao.');
  }

  db.sites.push({
    id: db.nextId++,
    name, url: cleanUrl, desc, cat,
    logo: ui.logoSrc, grad: (db.nextId*3) % GRADS.length,
    status: 'pending',
    by: ui.user.id, byName: ui.user.name,
    likes: 0, likedBy: [], ratings: [], visits: 0,
    at: Date.now()
  });
  saveDB();
  ui.logoSrc = ''; 
  toast('Submitted! Waiting for admin approval ⏳');
  go('/mine');
}
function delMine(id){
  if(!confirm('Remove this submission?')) return;
  db.sites = db.sites.filter(s=>s.id!==id);
  saveDB(); route(); toast('Removed');
}

/* ---------------- admin actions ---------------- */
function approve(id){
  const w = db.sites.find(s=>s.id===id); if(!w) return;
  w.status = 'approved'; saveDB(); route();
  toast('Approved — now live');
}
function approveAll(){
  const p = db.sites.filter(x=>x.status==='pending');
  if(!p.length || !confirm('Saari ' + p.length + ' pending websites approve karni hain?')) return;
  p.forEach(x=>x.status='approved');
  saveDB(); route(); toast(p.length + ' websites live ho gayi');
}
function reject(id){
  const w = db.sites.find(s=>s.id===id); if(!w) return;
  w.status = 'rejected'; saveDB(); route();
  toast('Rejected / hidden');
}
function delSite(id){
  if(!confirm('Delete this website permanently?')) return;
  db.sites = db.sites.filter(s=>s.id!==id);
  saveDB(); route(); toast('Deleted');
}

/* ---------------- boot ---------------- */
loadDB();
healUrls();
document.getElementById('year')?.remove();
renderAvatar();
renderChips();
route();

window.addEventListener('hashchange', route);
window.addEventListener('scroll', ()=>{
  document.getElementById('hdr').classList.toggle('scrolled', window.scrollY > 6);
});
document.querySelectorAll('.overlay').forEach(ov=>{
  ov.addEventListener('click', e=>{ if(e.target === ov) ov.classList.remove('show'); });
});
['aEmail','aPass','aName'].forEach(id=>{
  const el = document.getElementById(id);
  if(el) el.addEventListener('keydown', e=>{ if(e.key === 'Enter') doAuth(); });
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape') document.querySelectorAll('.overlay.show').forEach(o=>o.classList.remove('show'));
});
